$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Gateway is UP', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().status).to.eql('UP');
      });
    language: text/javascript
settings: {}
order: 1000
