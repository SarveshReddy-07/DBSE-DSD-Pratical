$kind: http-request
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Anita",
      "email": "anita@example.com",
      "password": "Pass@123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('User created', function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set('userId', pm.response.json().id);
    language: text/javascript
settings: {}
order: 2000
